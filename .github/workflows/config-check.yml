name: Config Check
on: push

jobs:
  check:
    name: Config Check
    runs-on: ubuntu-latest
    steps:
      # checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup taskfile
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0

      # prepare files
      - name: Prepare configuration files
        run: task prepare diff

      # check configuration
      - uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3.0.0
        with:
          image: homeassistant/home-assistant:stable
          options: -v ${{ github.workspace }}/config:/config
          run: hass --script check_config --config /config
